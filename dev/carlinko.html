<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jaecoo Card — CarLinko Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a; font-family: system-ui, sans-serif; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 16px;
    }
    #card-container { width: 100%; max-width: 380px; }
    .toolbar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 420px; }
    .toolbar button {
      padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07); color: #fff; font-size: 0.75em; cursor: pointer;
    }
    #log { color: #8f8; font: 11px monospace; max-width: 420px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="card-container"></div>
  <div class="toolbar">
    <button id="t-charge">Toggle charging</button>
    <button id="t-door">Toggle driver door</button>
    <button id="t-online">Toggle online</button>
  </div>
  <div id="log"></div>

<script>
  // Minimal ha-card stand-in
  class HaCard extends HTMLElement {
    constructor() { super(); this.attachShadow({ mode: 'open' }).innerHTML =
      '<style>:host{display:block;background:#111;border-radius:12px;overflow:hidden}</style><slot></slot>'; }
  }
  customElements.define('ha-card', HaCard);
</script>

<script type="module">
  const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
  await import('../dist/jaecoo-card.js');

  // Placeholder renders standing in for the CarLinko image entities
  const pic = (label, w, h) => 'data:image/svg+xml,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" rx="24" fill="#2a3a2f"/>` +
    `<text x="50%" y="50%" fill="#cfc" font-size="28" text-anchor="middle" font-family="sans-serif">${label}</text></svg>`);

  // Entity IDs intentionally use a Thai plate slug — the card must find them by translation_key
  const P = 'kk_1234';
  const reg = {};
  const states = {};
  const add = (domain, key, state, attributes = {}) => {
    const entity_id = `${domain}.${P}_${key}_x`;
    reg[entity_id] = { entity_id, platform: 'carlinko', translation_key: key, device_id: 'j5' };
    states[entity_id] = { entity_id, state, attributes };
  };
  add('sensor', 'battery', '78', { unit_of_measurement: '%' });
  add('sensor', 'range', '312', { unit_of_measurement: 'km' });
  add('sensor', 'speed', '0', { unit_of_measurement: 'km/h' });
  add('sensor', 'charge_state', 'idle');
  add('sensor', 'charge_power', '0', { unit_of_measurement: 'kW' });
  add('sensor', 'charge_mode', 'none');
  add('sensor', 'charge_remaining', '0', { unit_of_measurement: 'min' });
  add('sensor', 'energy_left', '41.2', { unit_of_measurement: 'kWh' });
  add('sensor', 'tyre_fl', '36.1', { unit_of_measurement: 'psi' });
  add('sensor', 'tyre_fr', '36.3', { unit_of_measurement: 'psi' });
  add('sensor', 'tyre_rl', '35.8', { unit_of_measurement: 'psi' });
  add('sensor', 'tyre_rr', '35.9', { unit_of_measurement: 'psi' });
  add('binary_sensor', 'charging', 'off');
  add('binary_sensor', 'online', 'on');
  add('binary_sensor', 'door_driver', 'off');
  add('binary_sensor', 'door_passenger', 'off');
  add('binary_sensor', 'door_rear_left', 'off');
  add('binary_sensor', 'door_rear_right', 'off');
  add('lock', 'lock', 'locked');
  add('binary_sensor', 'door', 'off');
  add('sensor', 'volt12', '12.6', { unit_of_measurement: 'V' });
  add('sensor', 'volt12_status', 'ok');
  add('sensor', 'tyre_status', 'normal');
  add('cover', 'sunroof', 'closed');
  add('climate', 'climate', 'off', { temperature: 22, min_temp: 16, max_temp: 30, target_temp_step: 1 });
  add('cover', 'windows', 'closed');
  add('cover', 'liftgate', 'closed');
  add('button', 'find', 'unknown');
  add('button', 'charge_stop', 'unknown');
  add('button', 'windows_vent', 'unknown');
  add('button', 'quick_cool', 'unknown');
  add('button', 'quick_heat', 'unknown');
  add('switch', 'defrost_cmd', 'off');
  add('switch', 'steer_heat', 'off');
  add('switch', 'purify', 'off');
  add('select', 'seat_heat_l', 'off', { options: ['off', 'l1', 'l2', 'l3'] });
  add('select', 'seat_heat_r', 'l2', { options: ['off', 'l1', 'l2', 'l3'] });
  add('select', 'seat_vent_l', 'l1', { options: ['off', 'l1', 'l2', 'l3'] });
  add('select', 'seat_vent_r', 'off', { options: ['off', 'l1', 'l2', 'l3'] });
  add('device_tracker', 'location', 'home');
  add('image', 'vehicle_front', 'idle', { entity_picture: pic('vehicle_front', 800, 450) });
  add('image', 'vehicle_top', 'idle', { entity_picture: pic('vehicle_top', 400, 800) });

  const LEVELS = { ok: 'OK', normal: 'Normal', off: 'Off', l1: 'Low', l2: 'Medium', l3: 'High', idle: 'Idle', charging: 'Charging', none: 'None', ac: 'AC' };
  const card = document.createElement('jaecoo-card');
  const push = () => {
    card.hass = {
      states: { ...states },
      entities: reg,
      devices: { j5: { name: 'KK 1234' } },
      formatEntityState: (st) => LEVELS[st.state] ?? st.state,
      callService: async (domain, service, data) => {
        log(`${domain}.${service} ${JSON.stringify(data)}`);
        const st = states[data.entity_id];
        if (!st) return;
        if (domain === 'lock') st.state = service === 'lock' ? 'locked' : 'unlocked';
        if (domain === 'switch') st.state = service === 'turn_on' ? 'on' : 'off';
        if (domain === 'cover') st.state = service === 'open_cover' ? 'open' : 'closed';
        if (domain === 'climate' && service === 'turn_on') st.state = 'cool';
        if (domain === 'climate' && service === 'turn_off') st.state = 'off';
        if (domain === 'select' && service === 'select_next') {
          const o = st.attributes.options; st.state = o[(o.indexOf(st.state) + 1) % o.length];
        }
        push();
      },
    };
  };
  card.setConfig({ type: 'custom:jaecoo-card', image_path: '../dist' });
  push();
  document.getElementById('card-container').appendChild(card);

  const s = (key) => states[Object.keys(reg).find(id => reg[id].translation_key === key)];
  document.getElementById('t-charge').onclick = () => {
    const on = s('charging').state === 'off';
    s('charging').state = on ? 'on' : 'off';
    s('charge_state').state = on ? 'charging' : 'idle';
    s('charge_power').state = on ? '6.6' : '0';
    s('charge_mode').state = on ? 'ac' : 'none';
    s('charge_remaining').state = on ? '95' : '0';
    push();
  };
  document.getElementById('t-door').onclick = () => {
    s('door_driver').state = s('door_driver').state === 'on' ? 'off' : 'on'; push();
  };
  document.getElementById('t-online').onclick = () => {
    s('online').state = s('online').state === 'on' ? 'off' : 'on'; push();
  };
  window.__push = push;
  log('ready');
</script>
</body>
</html>
